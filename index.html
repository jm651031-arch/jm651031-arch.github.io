<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中華健言社 100 期會外會 報名</title>
<style>
  /* ========== 設定區（你只要改這幾行）========== */
  /* GAS 網址：部署後拿到的網址，貼這裡 */
  /* 幹部密碼：講師示範用 1234，正式活動請改成複雜的 */
  /* ============================================ */

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(135deg, #fff8f0 0%, #ffe9d0 100%);
    min-height: 100vh;
    padding: 16px;
    color: #2d3748;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  /* 頂部標題 */
  .header {
    background: linear-gradient(135deg, #ff8c42 0%, #ff6b35 100%);
    color: #fff;
    padding: 24px 20px;
    text-align: center;
  }
  .header h1 { font-size: 22px; margin-bottom: 4px; }
  .header .sub { font-size: 13px; opacity: 0.95; }
  .header .meta {
    margin-top: 14px;
    padding: 10px;
    background: rgba(255,255,255,0.18);
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.7;
  }

  /* 分頁標籤 */
  .tabs {
    display: flex;
    background: #fff;
    border-bottom: 2px solid #f3f3f3;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab {
    flex: 1;
    padding: 14px 8px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: #718096;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    background: #fafafa;
  }
  .tab.active {
    color: #ff6b35;
    border-bottom-color: #ff6b35;
    background: #fff;
  }

  /* 內容區 */
  .panel { display: none; padding: 20px; }
  .panel.active { display: block; }

  /* 表單元素 */
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 600;
    color: #4a5568;
  }
  .field label .required { color: #e53e3e; }
  .field input, .field select {
    width: 100%;
    padding: 12px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-size: 16px;     /* 16px 防 iOS 自動放大 */
    background: #fff;
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus {
    outline: none;
    border-color: #ff8c42;
  }
  .field .hint {
    font-size: 12px;
    color: #a0aec0;
    margin-top: 4px;
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  /* 按鈕 */
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff8c42 0%, #ff6b35 100%);
    color: #fff;
    box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
  }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .btn-small {
    width: auto;
    padding: 6px 14px;
    font-size: 13px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-pay-no {
    background: #fed7aa;
    color: #c2410c;
  }
  .btn-pay-yes {
    background: #bbf7d0;
    color: #15803d;
  }

  /* 訊息卡片 */
  .alert {
    padding: 14px;
    border-radius: 10px;
    margin: 10px 0;
    font-size: 14px;
    line-height: 1.6;
  }
  .alert-success { background: #f0fdf4; color: #15803d; border: 1px solid #86efac; }
  .alert-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fca5a5; }
  .alert-info { background: #eff6ff; color: #1e40af; border: 1px solid #93c5fd; }
  .alert-warning { background: #fffbeb; color: #b45309; border: 1px solid #fcd34d; }

  /* 查詢結果卡片 */
  .result-card {
    background: #fff8f0;
    border: 2px solid #ffd9a8;
    border-radius: 12px;
    padding: 16px;
    margin-top: 12px;
  }
  .result-card .row-info {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #ffe5cc;
    font-size: 14px;
  }
  .result-card .row-info:last-child { border-bottom: none; }
  .result-card .row-info .label { color: #718096; }
  .result-card .row-info .value { font-weight: 600; color: #2d3748; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-paid { background: #bbf7d0; color: #15803d; }
  .badge-unpaid { background: #fed7aa; color: #c2410c; }

  /* 名單項目 */
  .person-card {
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    background: #fff;
  }
  .person-card .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .person-card .name {
    font-weight: 700;
    font-size: 16px;
  }
  .person-card .info {
    font-size: 12px;
    color: #718096;
    line-height: 1.6;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 30px;
    color: #a0aec0;
  }
  .spinner {
    display: inline-block;
    width: 32px;
    height: 32px;
    border: 3px solid #f3f3f3;
    border-top-color: #ff6b35;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 統計列 */
  .stats {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat {
    flex: 1;
    text-align: center;
    background: #fff8f0;
    border-radius: 10px;
    padding: 10px;
  }
  .stat .num { font-size: 24px; font-weight: 700; color: #ff6b35; }
  .stat .label { font-size: 11px; color: #718096; }

  /* 密碼輸入 */
  .lock-screen {
    text-align: center;
    padding: 40px 20px;
  }
  .lock-icon { font-size: 48px; margin-bottom: 12px; }
  .lock-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .lock-desc { font-size: 13px; color: #718096; margin-bottom: 20px; }
</style>
</head>
<body>

<div class="container">
  <!-- 頂部標題 -->
  <div class="header">
    <h1>🌾 中華健言社 100 期會外會</h1>
    <div class="sub">新城風糖休閒園區 · DIY 黑糖爆漿包</div>
    <div class="meta">
      📅 2026/10/10（六）09:00–16:00<br>
      💰 會員 550 ／ 非會員 700（含保險）
    </div>
  </div>

  <!-- 分頁標籤 -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('signup')">📝 報名</div>
    <div class="tab" onclick="switchTab('query')">🔍 查詢</div>
    <div class="tab" onclick="switchTab('admin')">👨‍💼 幹部</div>
  </div>

  <!-- ========== 報名分頁 ========== -->
  <div id="panel-signup" class="panel active">
    <div class="field">
      <label>姓名 <span class="required">*</span></label>
      <input type="text" id="f-name" placeholder="王小明">
    </div>
    <div class="field">
      <label>手機 <span class="required">*</span></label>
      <input type="tel" id="f-phone" placeholder="0912345678" maxlength="10">
      <div class="hint">10 碼，繳費登記用</div>
    </div>
    <div class="field">
      <label>身分證字號 <span class="required">*</span></label>
      <input type="text" id="f-id" placeholder="A123456789" maxlength="10">
      <div class="hint">僅供保險投保使用</div>
    </div>
    <div class="field">
      <label>出生年月日 <span class="required">*</span></label>
      <div class="row">
        <select id="f-year"></select>
        <select id="f-month"></select>
        <select id="f-day"></select>
      </div>
    </div>
    <div class="field">
      <label>所屬社團 <span class="required">*</span></label>
      <select id="f-club">
        <option value="">請選擇</option>
        <option value="諄言社">諄言社</option>
        <option value="三重社">三重社</option>
        <option value="三峽社">三峽社</option>
        <option value="鶯歌社">鶯歌社</option>
        <option value="竹北社">竹北社</option>
        <option value="新竹社">新竹社</option>
        <option value="中壢社">中壢社</option>
        <option value="湖口社">湖口社</option>
      </select>
    </div>
    <div class="field">
      <label>餐點 <span class="required">*</span></label>
      <select id="f-meal">
        <option value="">請選擇</option>
        <option value="葷食">葷食</option>
        <option value="素食">素食</option>
      </select>
    </div>
    <button class="btn btn-primary" id="btn-submit" onclick="submitSignup()">
      送出報名
    </button>
    <div id="signup-msg"></div>
  </div>

  <!-- ========== 查詢分頁 ========== -->
  <div id="panel-query" class="panel">
    <div class="alert alert-info">
      🔒 為保護隱私，查詢只會顯示報名狀態，不會顯示生日和身分證字號
    </div>
    <div class="field">
      <label>姓名或手機</label>
      <input type="text" id="q-keyword" placeholder="輸入姓名或手機任一項">
    </div>
    <button class="btn btn-primary" onclick="queryStatus()">查詢</button>
    <div id="query-result"></div>
  </div>

  <!-- ========== 幹部管理分頁 ========== -->
  <div id="panel-admin" class="panel">
    <!-- 密碼鎖畫面 -->
    <div id="admin-lock" class="lock-screen">
      <div class="lock-icon">🔐</div>
      <div class="lock-title">幹部專區</div>
      <div class="lock-desc">請輸入密碼進入名單管理</div>
      <div class="field">
        <input type="password" id="admin-pwd" placeholder="輸入密碼"
               onkeypress="if(event.key==='Enter') checkPwd()">
      </div>
      <button class="btn btn-primary" onclick="checkPwd()">進入</button>
      <div id="pwd-msg"></div>
    </div>

    <!-- 解鎖後的名單 -->
    <div id="admin-list" style="display:none;">
      <div class="stats">
        <div class="stat">
          <div class="num" id="stat-total">0</div>
          <div class="label">報名總數</div>
        </div>
        <div class="stat">
          <div class="num" id="stat-paid">0</div>
          <div class="label">已收款</div>
        </div>
        <div class="stat">
          <div class="num" id="stat-unpaid">0</div>
          <div class="label">未收款</div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="loadList()" style="margin-bottom:12px;">
        🔄 重新整理
      </button>
      <div id="list-area">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>
  </div>
</div>

<script>
  // ========== 設定區（記得改這兩個！）==========
  const GAS_URL = 'https://script.google.com/macros/s/你的部署網址/exec';
  const ADMIN_PASSWORD = '1234';
  // ============================================

  // ---------- 分頁切換 ----------
  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('panel-' + name).classList.add('active');
  }

  // ---------- 初始化生日下拉 ----------
  function initDateSelectors() {
    const ySel = document.getElementById('f-year');
    const mSel = document.getElementById('f-month');
    const dSel = document.getElementById('f-day');
    const thisYear = new Date().getFullYear();
    ySel.innerHTML = '<option value="">年</option>';
    for (let y = thisYear; y >= 1930; y--) {
      ySel.innerHTML += `<option value="${y}">${y}</option>`;
    }
    mSel.innerHTML = '<option value="">月</option>';
    for (let m = 1; m <= 12; m++) {
      mSel.innerHTML += `<option value="${m}">${m}</option>`;
    }
    dSel.innerHTML = '<option value="">日</option>';
    for (let d = 1; d <= 31; d++) {
      dSel.innerHTML += `<option value="${d}">${d}</option>`;
    }
  }
  initDateSelectors();

  // ---------- 報名送出 ----------
  async function submitSignup() {
    const name  = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const id    = document.getElementById('f-id').value.trim();
    const year  = document.getElementById('f-year').value;
    const month = document.getElementById('f-month').value;
    const day   = document.getElementById('f-day').value;
    const club  = document.getElementById('f-club').value;
    const meal  = document.getElementById('f-meal').value;

    const msg = document.getElementById('signup-msg');
    msg.innerHTML = '';

    if (!name || !phone || !id || !year || !month || !day || !club || !meal) {
      msg.innerHTML = '<div class="alert alert-error">⚠️ 所有欄位都要填</div>';
      return;
    }
    if (!/^09\d{8}$/.test(phone)) {
      msg.innerHTML = '<div class="alert alert-error">⚠️ 手機號碼格式不對</div>';
      return;
    }

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = '送出中...';
    msg.innerHTML = '<div class="alert alert-info">📤 處理中，請稍候</div>';

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({
          name, phone, id_number: id,
          birthday: `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`,
          club, meal
        })
      });
      const data = await res.json();
      if (data.ok) {
        msg.innerHTML = '<div class="alert alert-success">✅ 報名成功！我們會 Email 通知幹部</div>';
        // 清空表單
        ['f-name','f-phone','f-id','f-year','f-month','f-day','f-club','f-meal']
          .forEach(id => document.getElementById(id).value = '');
      } else {
        msg.innerHTML = `<div class="alert alert-error">❌ ${data.msg}</div>`;
      }
    } catch (err) {
      msg.innerHTML = '<div class="alert alert-error">❌ 連線失敗，請檢查網路</div>';
    } finally {
      btn.disabled = false;
      btn.textContent = '送出報名';
    }
  }

  // ---------- 查詢 ----------
  async function queryStatus() {
    const keyword = document.getElementById('q-keyword').value.trim();
    const result = document.getElementById('query-result');
    if (!keyword) {
      result.innerHTML = '<div class="alert alert-error">⚠️ 請輸入姓名或手機</div>';
      return;
    }
    result.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

    try {
      const res = await fetch(`${GAS_URL}?action=query&keyword=${encodeURIComponent(keyword)}`);
      const data = await res.json();

      if (!data.ok) {
        result.innerHTML = `<div class="alert alert-error">❌ ${data.msg}</div>`;
        return;
      }
      if (!data.found) {
        result.innerHTML = '<div class="alert alert-warning">📭 查無報名紀錄，您還沒報名喔！</div>';
        return;
      }

      // 注意：只顯示安全資訊
      result.innerHTML = `
        <div class="result-card">
          <div class="row-info">
            <span class="label">姓名</span>
            <span class="value">${data.name}</span>
          </div>
          <div class="row-info">
            <span class="label">所屬社團</span>
            <span class="value">${data.club}</span>
          </div>
          <div class="row-info">
            <span class="label">餐點</span>
            <span class="value">${data.meal}</span>
          </div>
          <div class="row-info">
            <span class="label">繳費狀態</span>
            <span class="value">
              ${data.paid 
                ? '<span class="badge badge-paid">✅ 已繳費</span>' 
                : '<span class="badge badge-unpaid">⏳ 未繳費</span>'}
            </span>
          </div>
        </div>
      `;
    } catch (err) {
      result.innerHTML = '<div class="alert alert-error">❌ 連線失敗</div>';
    }
  }

  // ---------- 幹部管理 ----------
  function checkPwd() {
    const pwd = document.getElementById('admin-pwd').value;
    const msg = document.getElementById('pwd-msg');
    if (pwd === ADMIN_PASSWORD) {
      document.getElementById('admin-lock').style.display = 'none';
      document.getElementById('admin-list').style.display = 'block';
      loadList();
    } else {
      msg.innerHTML = '<div class="alert alert-error">❌ 密碼錯誤</div>';
    }
  }

  async function loadList() {
    const area = document.getElementById('list-area');
    area.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

    try {
      const res = await fetch(`${GAS_URL}?action=list`);
      const data = await res.json();

      if (!data.ok) {
        area.innerHTML = `<div class="alert alert-error">❌ ${data.msg}</div>`;
        return;
      }

      const list = data.list;
      const paid = list.filter(p => p.paid).length;
      document.getElementById('stat-total').textContent = list.length;
      document.getElementById('stat-paid').textContent = paid;
      document.getElementById('stat-unpaid').textContent = list.length - paid;

      if (list.length === 0) {
        area.innerHTML = '<div class="alert alert-info">📭 還沒有人報名</div>';
        return;
      }

      area.innerHTML = list.map((p, idx) => `
        <div class="person-card">
          <div class="top">
            <span class="name">${idx + 1}. ${p.name}</span>
            <button class="btn-small ${p.paid ? 'btn-pay-yes' : 'btn-pay-no'}"
                    onclick="togglePay('${p.phone}', this)">
              ${p.paid ? '✅ 已收' : '⏳ 未收'}
            </button>
          </div>
          <div class="info">
            📱 ${p.phone}　🏢 ${p.club}　🍽 ${p.meal}
          </div>
        </div>
      `).join('');
    } catch (err) {
      area.innerHTML = '<div class="alert alert-error">❌ 連線失敗</div>';
    }
  }

  async function togglePay(phone, btn) {
    const oldText = btn.textContent;
    btn.textContent = '處理中...';
    btn.disabled = true;
    try {
      const res = await fetch(`${GAS_URL}?action=toggle&phone=${encodeURIComponent(phone)}`);
      const data = await res.json();
      if (data.ok) {
        // 重新載入名單（設計 1：可靠優先）
        loadList();
      } else {
        alert('失敗：' + data.msg);
        btn.textContent = oldText;
        btn.disabled = false;
      }
    } catch (err) {
      alert('連線失敗');
      btn.textContent = oldText;
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
